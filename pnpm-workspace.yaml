# pnpm 11 no longer reads .npmrc's shamefully-hoist; upstream's build relies
# on the hoisted layout (editor-ext imports prosemirror-* via hoisting).
shamefullyHoist: true

packages:
  - 'apps/*'
  - 'packages/*'

patchedDependencies:
  "scimmy@1.3.5": patches/scimmy@1.3.5.patch

overrides:
  prosemirror-changeset: 2.4.0
  y-prosemirror: 1.3.7
  glob: 13.0.6
  ws: 8.21.0
  dompurify: 3.4.11
  tmp: 0.2.7
  hono: 4.12.25
  mermaid: 11.15.0
  "nanoid@^3": 3.3.8
  socket.io-parser: 4.2.7
  serialize-javascript: 7.0.3
  lodash-es: 4.18.1
  lodash: 4.18.1
  "@hono/node-server": 1.19.13
  undici: 7.29.0
  "ajv@^6": 6.14.0
  "ajv@^8": 8.18.0
  underscore: 1.13.8
  immutable: 4.3.8
  express-rate-limit: 8.2.2
  "minimatch@^3": 3.1.5
  "minimatch@^5": 5.1.8
  flatted: 3.4.2
  "picomatch@<2.3.2": 2.3.2
  "picomatch@>=4.0.0 <4.0.4": 4.0.4
  fastify: 5.8.5
  "yaml@>=1.0.0 <1.10.3": 1.10.3
  "yaml@>=2.0.0 <2.8.3": 2.8.3
  "path-to-regexp@^8": 8.4.0
  "brace-expansion@^5": 5.0.9
  "@xmldom/xmldom": 0.8.13
  handlebars: 4.7.9
  # Security pickup from upstream (docmost/docmost main) while we stay based on
  # the v0.95.0 tag — bump out of cycle rather than adopting unreleased main.
  axios: 1.18.1
  langsmith: 0.7.0
  follow-redirects: 1.16.0
  protobufjs: 7.5.8
  ip-address: 10.3.1
  "brace-expansion@^1": 1.1.18
  "brace-expansion@^2": 2.1.4
  "brace-expansion@^3": 3.0.6
  engine.io: 6.6.7
  "fast-uri@^2": 2.4.4
  "fast-uri@^3": 3.1.5
  "fast-uri@^4": 4.1.2
  find-my-way: 9.7.0
  "form-data@^4": 4.0.6
  "glob@^10": 10.5.0
  "minimatch@^9": 9.0.7
  "minimatch@^10": 10.2.3
  "nanoid@^5": 5.1.16
  "tar@^7": 7.5.19
  "@fastify/static": 10.1.1

neverBuiltDependencies: []

allowBuilds:
  '@swc/core': true
  bcrypt: true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
