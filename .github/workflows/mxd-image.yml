# MxD fork image build — see MXD-FORK.md for the fork policy this implements.
#
# Builds ghcr.io/mxdgroup/docmost from this repo's Dockerfile (unchanged from
# upstream), scans it BEFORE pushing (fail on fixable HIGH/CRITICAL), attaches
# an SBOM, signs the pushed digest (keyless cosign), and records the base-image
# digest in the job summary so a build is attributable to its inputs.
#
# Triggers: pushes to mxd-main (sha-tagged images) and v*-mxd.* tags (release
# images production consumes). Production only ever pins v*-mxd.* tags by
# digest — tagging IS the promote step; an unreviewed commit cannot reach a
# production tag because mxd-main is branch-protected.
name: mxd-image

on:
  push:
    branches: [mxd-main]
    tags: ["v*-mxd.*"]
  pull_request:
    branches: [mxd-main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # cosign keyless signing

jobs:
  ee-clean-room:
    # Clean-room guard (plan Unit 8 / R7): fork commits must never modify EE
    # paths, and non-EE changes must never import from them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure base tag is available
        run: git fetch --no-tags origin +refs/tags/v0.95.0:refs/tags/v0.95.0 2>/dev/null || git fetch --tags https://github.com/docmost/docmost.git v0.95.0 || true
      # The guard is a tested script (scripts/mxd-ee-clean-room-check.sh) with a
      # built-in self-test, so it can never silently rot into a false pass.
      - name: Clean-room guard self-test
        run: MXD_CLEAN_ROOM_SELFTEST=1 bash scripts/mxd-ee-clean-room-check.sh
      - name: Fork must not modify or import EE paths
        run: bash scripts/mxd-ee-clean-room-check.sh

  fork-tests:
    # Gate on the fork's OWN specs. The full upstream jest suite has
    # pre-existing ESM/DI config failures we don't own, so we scope to the
    # tests the fork added or touched — this catches a broken/uncompilable
    # fork spec before it merges (the image build alone doesn't run jest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages (editor-ext, base-formula)
        run: pnpm nx run @docmost/editor-ext:build
      - name: Run fork specs
        working-directory: apps/server
        run: >-
          pnpm jest
          src/core/share
          src/collaboration/extensions/authentication.extension.spec.ts
          src/collaboration/extensions/persistence.extension.spec.ts
          src/core/page/page-access
          --ci

  build:
    runs-on: ubuntu-latest
    needs: ee-clean-room
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mxdgroup/docmost
          tags: |
            type=ref,event=tag
            type=sha,prefix=mxd-main-,enable=${{ github.ref == 'refs/heads/mxd-main' }}

      # Build once into the local daemon so the scan gates the push.
      - name: Build (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/mxdgroup/docmost:scan-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan before push (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/mxdgroup/docmost:scan-candidate
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Gate on the app's runtime tree. The skipped dirs hold the npm/pnpm
          # launcher tooling (global npm from the base image + the corepack
          # cache holding pnpm's own vendored deps) — present in upstream's
          # published image too, not reachable by requests. App-level vulns
          # are fixed via pnpm.overrides in package.json instead of ignored;
          # pnpm itself is kept CVE-fixed via the packageManager pin.
          skip-dirs: /usr/local/lib/node_modules,/home/node/.cache/node/corepack,/root/.cache/node/corepack,/usr/local/share/corepack

      # Same build inputs -> cache hit -> effectively a tag-and-push.
      # PR runs stop at the scan: nothing is pushed or signed from a PR.
      - name: Push
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: SBOM (attached as workflow artifact)
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/mxdgroup/docmost@${{ steps.push.outputs.digest }}
          artifact-name: sbom-${{ github.sha }}.spdx.json

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign pushed digest (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes ghcr.io/mxdgroup/docmost@${{ steps.push.outputs.digest }}

      - name: Record digests in job summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "## Image build record"
            echo "- pushed digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- base image (from Dockerfile FROM):"
            grep -m2 '^FROM' Dockerfile | sed 's/^/  - `/;s/$/`/'
            docker buildx imagetools inspect ghcr.io/mxdgroup/docmost@${{ steps.push.outputs.digest }} | sed -n '1,8p' | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
